services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    volumes:
      - wordpress_files:/var/www/html
      - ./custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_FORCE_SSL_ADMIN: false
      WORDPRESS_DEBUG: false
    depends_on:
      - db
    restart: always
    labels:
      com.datadoghq.ad.check_names: '["php_fpm"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.logs: '[{"source": "php", "service": "wordpress"}]'

  wordpress_gp:
    build:
      context: .
      dockerfile: Dockerfile.gigpeppers
    volumes:
      - wordpress_files_gp:/var/www/html_gp
      - ./custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_ggpprs
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_GP_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress_ggpprs
      WORDPRESS_FORCE_SSL_ADMIN: false
      WORDPRESS_DEBUG: false
    depends_on:
      - db
    restart: always
    labels:
      com.datadoghq.ad.check_names: '["php_fpm"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.logs: '[{"source": "php", "service": "wordpress-gp"}]'

  db:
    image: mariadb:10.5
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    restart: always
    command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    labels:
      com.datadoghq.ad.check_names: '["mysql"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"server": "%%host%%", "user": "datadog", "pass": "datadog_password"}]'
      com.datadoghq.ad.logs: '[{"source": "mysql", "service": "mariadb"}]'

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - wordpress_files:/var/www/html
      - wordpress_files_gp:/var/www/html_gp
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - wordpress
      - wordpress_gp
    restart: always
    labels:
      com.datadoghq.ad.check_names: '["nginx"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"nginx_status_url": "http://%%host%%:8080/nginx_status"}]'
      com.datadoghq.ad.logs: '[{"source": "nginx", "service": "nginx"}]'

  # ============ DATADOG AGENT ============
  datadog-agent:
    image: gcr.io/datadoghq/agent:latest
    container_name: datadog-agent
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE}
      DD_HOSTNAME: ${DD_HOSTNAME:-linode-wordpress}
      DD_TAGS: "env:production service:wordpress"
      # Enable logs collection
      DD_LOGS_ENABLED: true
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: true
      # Enable APM
      DD_APM_ENABLED: true
      DD_APM_NON_LOCAL_TRAFFIC: true
      # Enable process monitoring
      DD_PROCESS_AGENT_ENABLED: true
      # Enable container monitoring
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
      # Enable Docker integration
      DD_DOCKER_LABELS_AS_TAGS: '{"com.docker.compose.service":"service_name"}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /etc/passwd:/etc/passwd:ro
      - datadog_data:/opt/datadog-agent/run
    ports:
      - "8126:8126"  # APM
    restart: always
    depends_on:
      - nginx
      - db

volumes:
  db_data:
  datadog_data:
  wordpress_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/public
  wordpress_files_gp:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/public_gp
