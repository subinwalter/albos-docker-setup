; Custom PHP settings
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
memory_limit = 512M
max_input_vars = 3000

; Error handling - hide warnings/notices
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /var/log/php_errors.log
