services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    volumes:
      - wordpress_files:/var/www/html
      - ./custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_FORCE_SSL_ADMIN: false
      WORDPRESS_DEBUG: false
    depends_on:
      - db
    restart: always

  wordpress_gp:
    build:
      context: .
      dockerfile: Dockerfile.gigpeppers
    volumes:
      - wordpress_files_gp:/var/www/html_gp
      - ./custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_ggpprs
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_GP_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress_ggpprs
      WORDPRESS_FORCE_SSL_ADMIN: false
      WORDPRESS_DEBUG: false
    depends_on:
      - db
    restart: always

  db:
    image: mariadb:10.5
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    restart: always
    command: [ 'mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci' ]

  nginx:
    image: nginx:latest
    ports:
      - "8080:8080"
      - "8020:8020"
    volumes:
      - wordpress_files:/var/www/html
      - wordpress_files_gp:/var/www/html_gp
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - wordpress
      - wordpress_gp
    restart: always

volumes:
  db_data:
  wordpress_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/public
  wordpress_files_gp:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/public_gp
