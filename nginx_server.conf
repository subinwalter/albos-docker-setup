server {
    listen 8080;
    location /nginx_status {
        stub_status on;
        allow all;
    }
}

# Redirect all HTTP to HTTPS for alittlebitofspice.com
server {
    listen 80;
    server_name alittlebitofspice.com www.alittlebitofspice.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://alittlebitofspice.com$request_uri;
    }
}

# Redirect www to non-www (HTTPS)
server {
    listen 443 ssl;
    server_name www.alittlebitofspice.com;

    ssl_certificate /etc/letsencrypt/live/alittlebitofspice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alittlebitofspice.com/privkey.pem;

    return 301 https://alittlebitofspice.com$request_uri;
}

# Main HTTPS server for alittlebitofspice.com
server {
    listen 443 ssl;
    server_name alittlebitofspice.com;

    ssl_certificate /etc/letsencrypt/live/alittlebitofspice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alittlebitofspice.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html;
    index index.php index.html index.htm;
    client_max_body_size 20M;

    rewrite ^/sitemap\.xml sitemap_index.xml permanent;
    rewrite ^/sitemap_index.xml$ /index.php?sitemap=1 last;
    rewrite ^/([^/]+?)-sitemap([0-9]+)?.xml$ /index.php?sitemap=$1&sitemap_n=$2 last;
    rewrite ^/diet/(.*) /category/diet/$1 permanent;
    rewrite ^/difficulty/(.*) /category/difficulty/$1 permanent;
    rewrite ^/ingredients/(.*) /ingredient/$1 permanent;
    rewrite ^/recipe/(.*) /$1 permanent;

    location / {
        try_files $uri $uri/ /index.php?q=$uri&$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 8 512k;
        fastcgi_buffer_size 256k;
        fastcgi_send_timeout 2m;
        fastcgi_read_timeout 2m;
        fastcgi_connect_timeout 2m;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|otf)$ {
        try_files $uri $uri/ =404;
        expires max;
        log_not_found off;
        access_log off;
    }

    location ~ /\.ht {
        deny all;
    }
}

